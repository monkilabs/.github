# Reusable secret scan for every MonkiLabs repository.
#
# WHY HERE. GitHub's own secret scanning is disabled on the organisation's
# private repositories (plan), and until 2026-09-18 only `infra` scanned at all
# — tinybear carried a Google API key in .vscode/mcp.json for five days in March
# and nothing noticed. This workflow is infra's two scan jobs lifted into one
# place so the three product repos get the same gate from one definition, and a
# fix lands once.
#
# TWO MODES, one file:
#   mode: pr    — scan only the commits the pull request adds
#                 (`origin/<base>..HEAD` on the merge commit). A NEW secret
#                 fails the PR; old history cannot block unrelated work.
#   mode: full  — scan every commit against the caller's allowlist. Runs on
#                 push to main and weekly, so the whole history stays clean and
#                 any finding is unambiguous.
#
# The caller owns its `.infisical-scan.toml`: what is a false positive in one
# repository is a leak in another, so the allowlist cannot live here.
#
# `--redact`: a finding is reported by rule, file, line and commit — never by
# the matched value, which would otherwise be written into a log that is
# readable by everyone who can read the repository.
name: Secret scan (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: "'pr' scans origin/<base-ref>..HEAD; 'full' scans the whole history."
        required: true
        type: string
      base-ref:
        description: "Base branch name for mode 'pr' (e.g. main). Ignored for 'full'."
        required: false
        type: string
        default: main
      config:
        description: "Path of the caller's scan config."
        required: false
        type: string
        default: .infisical-scan.toml
      infisical-version:
        description: "Pinned Infisical CLI version (apt package pin)."
        required: false
        type: string
        default: "0.43.129"

permissions:
  contents: read

jobs:
  scan:
    name: Scan for committed secrets (${{ inputs.mode }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both modes need history: the range scan walks origin/<base>..HEAD,
          # the full scan walks everything. Cloning is seconds; scanning was the
          # cost, and the range mode is what keeps that off every PR push.
          fetch-depth: 0

      - name: Install the Infisical CLI (pinned)
        env:
          VERSION: ${{ inputs.infisical-version }}
        run: |
          set -euo pipefail
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y "infisical=${VERSION}"
          infisical --version

      - name: Scan
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ inputs.base-ref }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG is missing. Every caller owns its allowlist; copy one from a sibling repository and classify each entry." >&2
            exit 1
          fi
          case "$MODE" in
            pr)
              if [ -z "$BASE" ]; then
                echo "::error::mode 'pr' needs base-ref (pass github.base_ref)." >&2
                exit 1
              fi
              echo "Scanning origin/${BASE}..HEAD"
              infisical scan --config "$CONFIG" --no-color --redact --log-opts="origin/${BASE}..HEAD"
              ;;
            full)
              echo "Scanning the full history"
              infisical scan --config "$CONFIG" --no-color --redact
              ;;
            *)
              echo "::error::mode must be 'pr' or 'full', got '$MODE'." >&2
              exit 1
              ;;
          esac
